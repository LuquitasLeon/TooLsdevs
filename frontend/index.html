<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060e22" />

    <title>ToolsDevs | Creamos herramientas</title>
    <meta
      name="description"
      content="Desarrollo de software y ciberseguridad a medida en Tucumán, Argentina. Transformamos los problemas de tu empresa en soluciones tecnológicas, con la seguridad incorporada desde la primera línea de código."
    />
    <link rel="canonical" href="https://toolsdevs.com/" />

    <!-- Open Graph: cómo se ve el enlace al compartirlo en redes y WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ToolsDevs" />
    <meta property="og:title" content="ToolsDevs | Creamos herramientas" />
    <meta
      property="og:description"
      content="Desarrollo de software y ciberseguridad a medida en Tucumán, Argentina."
    />
    <meta property="og:url" content="https://toolsdevs.com/" />
    <meta property="og:image" content="https://toolsdevs.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ToolsDevs | Creamos herramientas" />
    <meta
      name="twitter:description"
      content="Desarrollo de software y ciberseguridad a medida en Tucumán, Argentina."
    />
    <meta name="twitter:image" content="https://toolsdevs.com/og-image.jpg" />

    <!-- Las fuentes se sirven desde el propio origen (src/styles/fonts.css),
         no desde Google Fonts: una conexión externa menos que bloquee el render. -->

    <!-- Datos estructurados: le dicen a Google que esto es un negocio local de
         Tucumán, clave para aparecer en búsquedas como "desarrollo web Tucumán". -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "ToolsDevs",
        "description": "Desarrollo de software y ciberseguridad a medida.",
        "url": "https://toolsdevs.com/",
        "email": "devstools.arg@gmail.com",
        "areaServed": "Tucumán, Argentina",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Tucumán",
          "addressCountry": "AR"
        },
        "sameAs": ["https://instagram.com/tools.devs"],
        "knowsAbout": [
          "Desarrollo de software",
          "Ciberseguridad",
          "Desarrollo web",
          "Infraestructura de redes"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
